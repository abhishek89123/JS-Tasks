<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    


    <script>
        var a=10
        var b=5
        document.write("<b> Arithemtic operator </b>","<br>")
        document.write(" Addition of ",a," and ",b, " is ", a+b ,"<br>")
        document.write(" Subtraction of ",a," and ",b, " is ", a-b ,"<br>")
        document.write(" Multiplication of ",a," and ",b, " is ", a*b ,"<br>")
        document.write(" Division of ",a," and ",b, " is ", a/b ,"<br>")
        document.write(" Exponential of ",a," and ",b, " is ", a**b ,"<br>")
        document.write(" Modulas of ",a," and "+b, " is ", a%b ,"<br>")    
        document.write("<br>");
        var a=20
        var b="20"
        document.write("<b> Relational operator </b>","<br>")
        document.write(" Strict equality ",a," and ",b," is ",a===b,"<br>")
        document.write(" Equality  ",a," and ",b," is ",a==b,"<br>")
        document.write(" Not equal ",a," and ",b," is ",a!=b,"<br>")
        document.write(" Less than  ",a," and ",b," is ",a<b,"<br>")
        document.write(" Greater than ",a," and ",b," is ",a>b,"<br>")
        document.write(" Lessthan or equal ",a," and ",b," is ",a<=b,"<br>")
        document.write(" Greaterthan or equal",a," and ",b," is ",a>=b,"<br>")
        document.write("<br>");
        var a=true
        var b=false
        document.write("<b> Logical operator </b>","<br>")
        document.write(" AND for ",a," , ",b," is ",a && b,"<br>")
        document.write(" OR  for ",a," , ",b," is ", a||b ,"<br>")        
        document.write(" NOT  for ",a," is ",!a,"<br>")   
        document.write("<br>");
        var a=30
        var b=40
        document.write("<b> Assignment operator </b>","<br>")
        document.write(" Assign and Addition of ",a," and ",b, " is ", a+=b ,"<br>")
        document.write(" Assign and Subtraction of ",a," and ",b, " is ", a-=b ,"<br>")
        document.write(" Assign and Multiplication of ",a," and ",b, " is ", a*=b ,"<br>")
        document.write(" Assign and Division of ",a," and ",b, " is ", a/=b ,"<br>")
        document.write(" Assign and Exponential of ",a," and ",b, " is ", a**=b ,"<br>")
        document.write(" Assign and Modulas of ",a," and "+b, " is ", a%=b ,"<br>")    
        document.write("<br>");

        document.write("<b>Bitwise Operators</b>","</br>")
        var a=8;
        var b=5;
        var x=1;
        var y=2;
        var z=-5
        document.write("AND-- & of " ,a," and ",b," is ", a&b,"</br>");
        document.write("OR-- | of ",a," and ",b," is ", a|b,"</br>");
        document.write("NOT-- ~ of ",b," is ",~b,"</br>");
        document.write("XOR-- ^ of ",a," and ",b," is ", a^b,"</br>");
        document.write("Left shift-- << of ",x," and ",y," is ", x<<y,"</br>");
        document.write("Right shift-- >> of ",z," and ",x," is ", z>>x,"</br>");
        document.write("Unsigned Right shift-- >>> of ",z," and ",x," is ", z>>>x,"</br>");
        document.write("Unsigned Right shift-- >>> of ",b," and ",x," is ", b>>>x,"</br>");


        document.write("<b>Unary Operators</b>","</br>")
        document.write("Arithmetic operator</br>");
        var o=12
        document.write("Before increment: ",o,"</br>");
        o=o+1
        document.write("After increment: ",o,"</br>");
        document.write("Assignment operator</br>");
        var p=12
        document.write("Before increment: ",p,"</br>");
        p+=1
        document.write("After increment: ",p,"</br>");
        document.write("Unary operator</br>");
        var q=12
        document.write("Before increment: ",q,"</br>");
        q++
        document.write("After increment: ",q,"</br>");
        document.write("Post increment","</br>");
        var g=10
        document.write(g++,"</br>");
        document.write(g,"</br>");
        document.write("Pre increment","</br>");
        var h=2
        document.write(++h,"</br>"); 
        document.write(h,"</br>"); 
    </script>
