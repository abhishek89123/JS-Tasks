<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        padding: 50px;
    }
    body {
        text-align: center;
    }
    label {
        display: inline-block;
        width: 100px;
        text-align: left;
        margin: 8px;
        font-size: 16px;
    }
    input {
        height: 35px;
        width: 300px;
        border: 1px solid black;
        border-radius: 5px;
        padding-left: 10px;
        font-size: 14px;
        margin: 5px;
    }
    button {
        height: 38px;
        min-width: 120px;
        margin: 10px 5px;
        border: 1px solid black;
        border-radius: 5px;
        background-color: rgb(15, 43, 196);
        color: white;
        font-size: 14px;
        font-weight: bold;
    }
    button:hover {
        background-color: rgb(10, 30, 150);
    }
</style>
</head>
<body>
    <label>Enter num 1 :</label>
    <input type="text" placeholder="Enter Num 1" id="num1" /> <br />
    <label>Enter num 2 :</label>
    <input type="text" placeholder="Enter Num 2" id="num2" /> <br />

    <label>Result :</label>
    <input type="text" id="res" readonly /> <br />
    <button onclick="addtwo()">Add</button>
    <button onclick="subtwo()">Subtract</button>
    <button onclick="Multiply()">Multiply</button>
    <button onclick="Divide()">Divide</button>
    <script>
        function addtwo() {
        var n1 = parseInt(document.getElementById("num1").value);
        var n2 = parseInt(document.getElementById("num2").value);
        var sum = n1 + n2
        document.getElementById("res").value = sum;
      }
     function subtwo() {
        var n1 = parseInt(document.getElementById("num1").value);
        var n2 = parseInt(document.getElementById("num2").value);
        var sum = n1 - n2
        document.getElementById("res").value = sum;
      }
      function Multiply() {
        var n1 = parseInt(document.getElementById("num1").value);
        var n2 = parseInt(document.getElementById("num2").value);
        var sum = n1 * n2
        document.getElementById("res").value = sum;
      }
      function Divide() {
        var n1 = parseInt(document.getElementById("num1").value);
        var n2 = parseInt(document.getElementById("num2").value);
        var sum = n1 / n2
        document.getElementById("res").value = sum;
      }
    </script>
</body>
</html>
