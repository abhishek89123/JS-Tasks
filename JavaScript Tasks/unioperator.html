<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unary Operators</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            min-height: 100vh;
            padding: 30px;
            color: black;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 25px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        .output {
            width: 100%;
            border: 1px solid #777;
            background-color: white;
            padding: 0;
            font-size: 17px;
            line-height: 1.8;
        }

        .output-content {
            padding: 20px;
            text-align: left;
        }

        .section {
            font-weight: bold;
            font-size: 20px;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .result {
            border-bottom: 1px solid #ddd;
            padding: 5px 10px;
        }
    </style>
</head>

<body>

    <h1>Unary Operators: Increment and Decrement</h1>

    <div class="table-container">

        <div class="output">

            <div class="output-content">

                <div class="section">
                    Increment and Decrement Operations
                </div>

                <script>
                    document.write("Unary Operators"+"<br>");
                    var n=10;
                    n++;
                    document.write("value after applying the increment operator:"+n+"<br>");
                    n--;
                    document.write("value after applying the decrement operator:"+n+"<br>");
                    document.write("post increment"+"<br>");
                    var a=10;
                    document.write("the value of a:"+(a++)+"<br>");
                    document.write("the value of a after applying the post increment operator:"+a+"<br>");
                    document.write("pre increment"+"<br>");
                    var b=20;
                    document.write("the value of b:"+(++b)+"<br>");
                    document.write("the value of b after applying the pre increment operator:"+b+"<br>");
                    document.write("post decrement"+"<br>");
                    var c=10;
                    document.write("the value of c:"+(c--)+"<br>");
                    document.write("the value of c after applying the post decrement operator:"+c+"<br>");
                    document.write("pre decrement"+"<br>");
                    var d=20;
                    document.write("the value of d:"+((--d))+"<br>");
                    document.write("the value of d after applying the pre decrement operator:"+d+"<br>");
                </script>

            </div>

        </div>

    </div>

</body>
</html>
